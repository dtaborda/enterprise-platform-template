name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      apply:
        description: "Run reconcile in apply mode (true = mutate, false = dry-run preview only)"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Never cancel a release in progress

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TOKEN_SOURCE: ${{ secrets.RELEASE_PLEASE_TOKEN != '' && 'RELEASE_PLEASE_TOKEN' || 'GITHUB_TOKEN' }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Release token summary
        run: |
          echo "## Release token" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: \`$RELEASE_TOKEN_SOURCE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Note: a configured PAT does NOT fall back automatically if it is expired or under-scoped." >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update release PR
        uses: googleapis/release-please-action@a37ac6e4f6449ce8b3f7607e4d97d0146028dc0b # v4.1.0
        id: release
        with:
          # Uses a PAT instead of GITHUB_TOKEN so the release PR triggers CI workflows.
          # GITHUB_TOKEN-created PRs cannot trigger other workflows (GitHub security rule).
          # Create a fine-grained PAT with: contents:write + pull-requests:write
          # Then add it as a repository secret named RELEASE_PLEASE_TOKEN.
          # Falls back to GITHUB_TOKEN only when the PAT secret is EMPTY/UNSET.
          # An expired or under-scoped PAT is still a non-empty string and will NOT auto-fallback.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Release summary
        run: |
          if [ "$RELEASE_CREATED" = "true" ]; then
            echo "## 🚀 Release Published" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Tag** | \`$TAG_NAME\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Version** | \`$VERSION\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Commit** | \`$SHA\` |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ℹ️ No release published in this run" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "release-please did not publish a tag/release in this execution." >> "$GITHUB_STEP_SUMMARY"
            echo "The consistency guard below will decide whether that outcome is expected or broken." >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          VERSION: ${{ steps.release.outputs.version }}
          SHA: ${{ steps.release.outputs.sha }}

      - name: Check release consistency
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_PENDING_GRACE_HOURS: "2"
        run: node scripts/release/check-consistency.mjs

  # ---------------------------------------------------------------------------
  # Manual reconciliation — runs ONLY via workflow_dispatch
  # ---------------------------------------------------------------------------
  reconcile:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Run release reconciliation
        id: reconcile
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # pipefail is required: without it the pipe returns tee's exit code (always 0),
          # which would silently mask a failed reconciliation as a successful one.
          set -o pipefail
          node scripts/release/reconcile.mjs ${{ inputs.apply && '--apply' || '' }} 2>&1 | tee /tmp/reconcile-output.txt

      - name: Write step summary
        if: always()
        run: |
          echo "## Release reconciliation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: \`${{ inputs.apply && 'apply' || 'dry-run' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/reconcile-output.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no output captured)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Failure alerting — opens/updates a tracking issue when release-please fails
  # ---------------------------------------------------------------------------
  alert-on-failure:
    if: failure() && github.event_name == 'push'
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2
        with:
          egress-policy: audit

      - name: Open or update failure tracking issue
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const label = 'release-pipeline-broken';
            const title = 'Release pipeline is broken on main';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha;
            const dispatchUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/release.yml`;
            // Pinned to the failing commit so the runbook always resolves, and shows
            // the runbook exactly as it existed when the failure happened.
            const runbookUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/blob/${context.sha}/docs/developer-guide/releases.mdx`;

            const body = [
              `## Release pipeline failure`,
              ``,
              `The Release workflow failed on a push to \`main\`.`,
              ``,
              `| Detail | Value |`,
              `|--------|-------|`,
              `| **Failing run** | [${context.runId}](${runUrl}) |`,
              `| **Commit** | \`${sha}\` |`,
              ``,
              `### How to repair`,
              ``,
              `1. Read the [recovery runbook](${runbookUrl}).`,
              `2. Go to the [Release workflow](${dispatchUrl}) and run it via **workflow_dispatch**.`,
              `3. Set \`apply\` to \`false\` first to preview what will happen (dry-run).`,
              `4. If the preview is correct, rerun with \`apply\` = \`true\` to create the missing release and fix labels.`,
              ``,
              `### Manual fallback`,
              ``,
              `\`\`\`bash`,
              `# 1. Extract release notes from CHANGELOG.md at the merge commit`,
              `# 2. gh release create vX.Y.Z --target <merge-commit-sha> --notes-file <notes> --latest`,
              `# 3. gh pr edit <N> --remove-label "autorelease: pending" --add-label "autorelease: tagged"`,
              `\`\`\``,
            ].join('\n');

            // Ensure the label exists (create if missing)
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
            } catch (e) {
              if (e.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: 'B60205',
                  description: 'The release pipeline on main is broken and needs reconciliation',
                });
                core.info(`Created label "${label}"`);
              } else {
                throw e;
              }
            }

            // Search for an existing open issue with this label
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: label,
              state: 'open',
              per_page: 1,
            });

            if (existing.length > 0) {
              // Add a comment to the existing issue
              const issue = existing[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Another release failure detected.\n\n- **Run**: [${context.runId}](${runUrl})\n- **Commit**: \`${sha}\``,
              });
              core.info(`Updated existing issue #${issue.number}`);
            } else {
              // Create a new issue
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: [label],
              });
              core.info(`Created issue #${created.number}`);
            }
